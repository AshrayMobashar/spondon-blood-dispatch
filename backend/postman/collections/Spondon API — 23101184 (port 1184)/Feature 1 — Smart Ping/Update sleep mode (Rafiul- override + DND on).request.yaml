$kind: http-request
name: "Update sleep mode (Rafiul: override + DND on)"
url: "{{baseUrl}}/api/donors/{{donor_id}}/sleep-mode"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "enabled": true,
      "start": "23:00",
      "end": "07:00",
      "allow_extreme_emergencies": true,
      "dnd_on": true
    }
order: 5000
